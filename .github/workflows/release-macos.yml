name: Release macOS

# Construye el .dmg y el .app para macOS (sin firmar) y los adjunta como
# borrador de GitHub Release en cada tag vX.Y.Z, igual que release-linux.yml.
# El flujo de Windows sigue siendo manual (ver README.md, sección "Publicar
# una nueva Release") — este workflow crea/actualiza el mismo borrador para
# que el maintainer solo tenga que subir los 3 ficheros de Windows encima y
# pulsar "Publish".
#
# La versión se lee de src-tauri/tauri.conf.json (no de github.ref_name):
# permite lanzar este workflow a mano (workflow_dispatch) sobre `master` para
# adjuntar los artefactos de macOS a una Release cuyo tag ya existe, sin
# depender de que se empuje un tag nuevo — mismo motivo que en
# release-linux.yml (ver ADR-019 en dbv-specs-ops/memory.md).
#
# El input `draft` (solo aplica a workflow_dispatch; en un push de tag siempre
# es "true") controla si se busca/crea un borrador o si se añade directamente
# a una Release ya publicada. tauri-action *falla* si le pides "true" y solo
# existe una Release publicada con ese tag (no la toca, simplemente no la
# encuentra) — así que para una versión que ya se publicó a mano hay que
# lanzarlo con `draft: false` explícitamente.
#
# Build sin firmar ni notarizar (no hay cuenta de Apple Developer de pago).
# `tauri.macos.conf.json` (targets: dmg + app) se fusiona automáticamente
# por convención de nombre de plataforma, sin necesidad de pasar --config
# a mano.
#
# Auto-actualización en macOS: OPCIONAL, activada solo si el repo tiene
# configurados los secrets TAURI_SIGNING_PRIVATE_KEY /
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (Settings → Secrets and variables →
# Actions), la misma clave que ya se usa para firmar Windows en local
# (`npx tauri signer generate` si no existe todavía). Sin esos secrets, este
# workflow se comporta exactamente igual que antes: `createUpdaterArtifacts`
# se queda en `false` (el valor de `tauri.macos.conf.json`) y no se genera
# ningún `.sig`, algo imprescindible, porque con `createUpdaterArtifacts:
# true` y sin clave, `tauri build` termina en exit 1 aunque el .dmg/.app se
# generen bien (mismo problema documentado en la Lección 16 de memory.md
# para Windows). Por eso la activación es un `--config` inyectado solo
# cuando el secret existe, no un cambio directo del archivo: ver el paso
# "Comprobar si hay clave de firma configurada".
#
# Con la clave configurada, además del .dmg/.app de siempre se genera y
# firma un .app.tar.gz (el artefacto que usa el updater de Tauri), y
# scripts/generate-macos-updater-fragment.mjs sube sus entradas darwin-* como
# un asset aparte de la Release (`latest-macos-fragment.json`). Luego
# scripts/generate-latest-json.mjs (que el maintainer sigue ejecutando en
# local para el resto de la Release, sin ningún cambio) lo recoge y lo
# fusiona en el latest.json final. El flujo manual de Windows no cambia en
# ningún caso, con o sin esta clave configurada.
#
# El .dmg resultante no está firmado: al abrirlo en un Mac, Gatekeeper avisa
# de "desarrollador no verificado" (ver README.md, sección "🍎 macOS"). Es el
# mismo artefacto pensado también para publicarse en Uptodown, que a
# diferencia de Microsoft Store / Mac App Store no exige firma de Apple.
#
# Build universal (--target universal-apple-darwin), no solo aarch64: el
# runner `macos-latest` de GitHub es Apple Silicon, así que sin esto
# tauri-action compilaría solo para la arquitectura nativa del runner y el
# .dmg resultante no arrancaría en absoluto en un Mac Intel (Rosetta traduce
# x86_64→Apple Silicon, no al revés). Requiere tener instalados ambos targets
# de Rust (`aarch64-apple-darwin` + `x86_64-apple-darwin`) antes del build.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      draft:
        description: >
          "true" (normal): crea/usa un borrador para esa versión, a completar a mano con
          los ficheros de Windows antes de publicar. "false": la Release de esa versión ya
          existe PUBLICADA y solo quieres añadirle los artefactos de macOS, sin tocar su
          estado ni crear un borrador nuevo.
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build-macos:
    runs-on: macos-latest
    # El GITHUB_TOKEN por defecto del repo es de solo lectura (Settings → Actions →
    # Workflow permissions), así que sin esto tauri-action falla al subir los
    # artefactos con "Resource not accessible by integration". Se concede permiso
    # de escritura solo a este workflow, no al valor por defecto de todo el repo.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Leer versión de tauri.conf.json
        id: version
        run: echo "tag=v$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Determinar si la Release debe crearse/tratarse como borrador
        id: draft
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.draft }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar Rust (targets Intel + Apple Silicon)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-apple-darwin,x86_64-apple-darwin"

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Instalar dependencias de Node
        run: npm install

      # No usar `${{ secrets.X }}` directamente dentro de `run:` (se interpola en el
      # texto del script antes de ejecutarse, y una clave con comillas/saltos de
      # línea lo rompería). Se pasa por `env:` y se lee como variable de entorno normal.
      - name: Comprobar si hay clave de firma configurada
        id: signing
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$HAS_KEY" ]; then
            echo 'extra_args=--config {"bundle":{"createUpdaterArtifacts":true}}' >> "$GITHUB_OUTPUT"
          else
            echo "extra_args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build y Release (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target universal-apple-darwin ${{ steps.signing.outputs.extra_args }}
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: ${{ steps.version.outputs.tag }}
          releaseDraft: ${{ steps.draft.outputs.value }}
          prerelease: false
          includeUpdaterJson: false

      - name: Subir fragmento darwin-* del updater (solo si hay clave de firma)
        if: steps.signing.outputs.extra_args != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-macos-updater-fragment.mjs "${{ steps.version.outputs.tag }}"
