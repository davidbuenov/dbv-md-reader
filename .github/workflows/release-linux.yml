name: Release Linux

# Construye los paquetes .deb y .AppImage para Linux y los adjunta como
# borrador de GitHub Release en cada tag vX.Y.Z. El flujo de Windows sigue
# siendo manual (ver README.md, sección "Publicar una nueva Release") — este
# workflow crea/actualiza el mismo borrador para que el maintainer solo tenga
# que subir los 3 ficheros de Windows encima y pulsar "Publish".
#
# La versión se lee de src-tauri/tauri.conf.json (no de github.ref_name):
# permite lanzar este workflow a mano (workflow_dispatch) sobre `master` para
# adjuntar los artefactos de Linux a una Release cuyo tag ya existe (p.ej. si
# la versión no cambió respecto al último tag, como decidió el proyecto para
# la 0.7.0 — ver ADR-019 en dbv-specs-ops/memory.md), sin depender de que se
# empuje un tag nuevo.
#
# Sin auto-actualización en Linux por ahora (deuda técnica consciente, ver
# dbv-specs-ops/memory.md): no se pasan las variables TAURI_SIGNING_*, así que
# no se genera .sig ni se sube manifiesto de updater para esta plataforma.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Leer versión de tauri.conf.json
        id: version
        run: echo "tag=v$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias del sistema (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias de Node
        run: npm install

      - name: Build y Release (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: "dbv-md-reader ${{ steps.version.outputs.tag }}"
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
